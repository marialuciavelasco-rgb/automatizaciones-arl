<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARL Dashboard · Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f0f4f8; }
    .login-card {
      background: white; border-radius: 12px; padding: 40px 48px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10); width: 100%; max-width: 380px;
    }
    .login-logo { text-align: center; margin-bottom: 24px; }
    .login-logo h1 { font-size: 1.4rem; color: #1e3a5f; margin: 8px 0 4px; }
    .login-logo p  { color: #64748b; font-size: 0.85rem; margin: 0; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db;
      border-radius: 8px; font-size: 0.95rem; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    .btn-login {
      width: 100%; padding: 11px; background: #1e3a5f; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: background 0.2s;
    }
    .btn-login:hover { background: #2563eb; }
    .error-msg {
      background: #fee2e2; color: #dc2626; padding: 10px 14px;
      border-radius: 8px; font-size: 0.875rem; margin-bottom: 16px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div style="font-size:2.5rem">🏥</div>
      <h1>ARL Dashboard</h1>
      <p>BIA Technologies &amp; BIA Energy</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="admin" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Ingresar</button>
    </form>
  </div>
</body>
</html>
