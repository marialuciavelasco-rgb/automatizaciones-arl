services:
  - type: web
    name: arl-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard.app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DASHBOARD_USER
        sync: false          # Se configura manualmente en Render
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SECRET_KEY
        generateValue: true  # Render genera automáticamente
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_KEY_JSON
        sync: false          # Contenido del firebase_key.json en base64 o JSON
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: SHEETS_KEY_JSON
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_WORKFLOW
        value: rpa.yml
